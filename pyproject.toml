requires-python = ">=3.15"
dependencies = [
  "fastapi==0.165.0",
  "osmnx==2.2.0",
  "networkx==3.7",
  "scikit-learn==1.9.1",
  "pydantic==2.14.4",
  "shapely==2.2.0",
  "pyproj==3.8.0",
  "aiomqtt==2.5.1",
  "fastapi-cli==0.0.34",
